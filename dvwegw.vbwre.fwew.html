                                <div style="text-align: right;">
                                    <div style="font-weight: 600;">$\\\${{ item.price.toFixed(2) }}</div>
                                    <div :style="{ color: item.change >= 0 ? 'var(--success)' : 'var(--danger)', fontSize: '12px', fontWeight: '500' }">
                                        {{ item.change >= 0 ? '+' : '' }}{{ item.change.toFixed(2) }}%
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const type = route.params.type;

                const titles = {
                    gainers: 'Top Gainers',
                    losers: 'Top Losers',
                    active: 'Most Active',
                    potential: 'Potential Growth',
                    picks: "Today's Picks",
                    avoid: 'Avoid List',
                    watchlist: 'Watchlist'
                };

                const title = computed(() => titles[type] || 'Market List');

                const subList = computed(() => {
                    let count = 10;
                    if (type === 'losers') count = 5;
                    if (type === 'active') count = 8;
                    if (type === 'potential') count = 6;
                    
                    let sorted = [...stockList];
                    if (type === 'gainers' || type === 'picks') sorted.sort((a,b) => b.change - a.change);
                    if (type === 'losers' || type === 'avoid') sorted.sort((a,b) => a.change - b.change);
                    if (type === 'active') sorted.sort(() => 0.5 - Math.random());
                    if (type === 'potential') sorted.sort((a,b) => b.price - a.price);
                    
                    return sorted.slice(0, count);
                });

                function openDetail(item) {
                    router.push({ path: '/detail', query: { code: item.code, name: item.name, price: item.price, change: item.change } });
                }

                return { title, subList, openDetail };
            }
        };

        // Article / Guide Component
        const ArticleComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="header-title">Financial Guide</div>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="card">
                        <h2 style="font-size: 18px; margin-bottom: 8px;">Navigating Market Volatility in 2026</h2>
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Published by NJJIAMAX Analytics</div>
                        <p style="margin-bottom: 12px;">Modern portfolios require robust diversification across asset classes. As interest rate environments stabilize, maintaining a disciplined dollar-cost averaging strategy remains a cornerstone for long-term capital preservation.</p>
                        <p style="margin-bottom: 12px;">Key metrics to monitor include sector rotation trends, liquidity distribution, and macroeconomic indicators. Avoid emotional reactions to short-term price fluctuations.</p>
                    </div>
                </div>
            `
        };

        // 3. Toolbox Component
        const ToolboxComp = {
            template: `
                <div class="view-container">
                    <div class="header-bar">
                        <div class="header-title">Financial Toolbox</div>
                    </div>

                    <!-- Tool 1: DCA Profit-Taking -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 10px;">1. DCA Profit-Taking Calculator</h3>
                        <div class="input-group">
                            <label>Average Cost ($)</label>
                            <input type="number" v-model.number="dca.cost" />
                        </div>
                        <div class="input-group">
                            <label>Holdings Share</label>
                            <input type="number" v-model.number="dca.shares" />
                        </div>
                        <div class="input-group">
                            <label>Target Price ($)</label>
                            <input type="number" v-model.number="dca.target" />
                        </div>
                        <div style="background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px;">
                            Estimated Return: <span :style="{ color: dcaProfit >= 0 ? 'var(--success)' : 'var(--danger)', fontWeight: 'bold' }">\\\${{ dcaProfit.toFixed(2) }} ({{ dcaPct.toFixed(2) }}%)</span>
                        </div>
                    </div>

                    <!-- Tool 2: Loan Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 10px;">2. Loan Calculator</h3>
                        <div class="input-group">
                            <label>Loan Amount ($)</label>
                            <input type="number" v-model.number="loan.amount" />
                        </div>
                        <div class="input-group">
                            <label>Annual Interest Rate (%)</label>
                            <input type="number" v-model.number="loan.rate" />
                        </div>
                        <div class="input-group">
                            <label>Tenure (Months)</label>
                            <input type="number" v-model.number="loan.months" />
                        </div>
                        <button class="btn" @click="calcLoan">Calculate Payment</button>
                        <div v-if="loan.monthlyPayment > 0" style="margin-top: 10px; background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px;">
                            Monthly Payment: <b>\\\${{ loan.monthlyPayment.toFixed(2) }}</b>
                        </div>
                    </div>

                    <!-- Tool 3: Profit Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 10px;">3. Profit Calculator</h3>
                        <div class="input-group">
                            <label>Unit Cost ($)</label>
                            <input type="number" v-model.number="profit.cost" />
                        </div>
                        <div class="input-group">
                            <label>Selling Price ($)</label>
                            <input type="number" v-model.number="profit.price" />
                        </div>
                        <div class="input-group">
                            <label>Volume</label>
                            <input type="number" v-model.number="profit.qty" />
                        </div>
                        <div style="background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px;">
                            Total Profit: <b>\\\${{ totalProfit.toFixed(2) }}</b>
                        </div>
                    </div>

                    <!-- Tool 4: Password Strength & MD5 -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 10px;">4. Password Strength & MD5</h3>
                        <div class="input-group">
                            <label>Enter Password</label>
                            <input type="password" v-model="pwd.text" />
                        </div>
                        <div style="background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px;">
                            <div>Strength: <b :style="{ color: pwdColor }">{{ pwdStrength }}</b></div>
                            <div style="word-break: break-all; margin-top: 4px; font-size: 11px; color: var(--text-muted);">MD5: {{ pwdHash }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // Tool 1
                const dca = ref({ cost: 100, shares: 50, target: 120 });
                const dcaProfit = computed(() => (dca.value.target - dca.value.cost) * dca.value.shares);
                const dcaPct = computed(() => dca.value.cost > 0 ? ((dca.value.target - dca.value.cost) / dca.value.cost) * 100 : 0);

                // Tool 2
                const loan = ref({ amount: 10000, rate: 5, months: 12, monthlyPayment: 0 });
                function calcLoan() {
                    const p = loan.value.amount;
                    const r = loan.value.rate / 100 / 12;
                    const n = loan.value.months;
                    if (r === 0) {
                        loan.value.monthlyPayment = p / n;
                    } else {
                        loan.value.monthlyPayment = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                    }
                }

                // Tool 3
                const profit = ref({ cost: 50, price: 80, qty: 100 });
                const totalProfit = computed(() => (profit.value.price - profit.value.cost) * profit.value.qty);

                // Tool 4
                const pwd = ref({ text: '' });
                const pwdStrength = computed(() => {
                    const len = pwd.value.text.length;
                    if (len === 0) return 'Empty';
                    if (len < 6) return 'Weak';
                    if (len < 10) return 'Moderate';
                    return 'Strong';
                });
                const pwdColor = computed(() => {
                    if (pwdStrength.value === 'Weak') return 'var(--danger)';
                    if (pwdStrength.value === 'Moderate') return '#f59e0b';
                    if (pwdStrength.value === 'Strong') return 'var(--success)';
                    return 'var(--text-muted)';
                });
                const pwdHash = computed(() => pwd.value.text ? md5(pwd.value.text) : 'N/A');

                return { dca, dcaProfit, dcaPct, loan, calcLoan, profit, totalProfit, pwd, pwdStrength, pwdColor, pwdHash };
            }
        };

        // 4. Settings Component
        const SettingsComp = {
            template: `
                <div class="view-container">
                    <div class="header-bar">
                        <div class="header-title">Settings</div>
                    </div>
                    <div style="padding: 16px;">
                        <div style="border: 1px solid var(--border); border-radius: var(--radius); background: var(--card-bg); overflow: hidden;">
                            <div @click="$router.push('/version')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Version Information</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/privacy')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Privacy Policy</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/terms')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Terms of Service</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/team')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>About Team</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="contactUs" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Contact Us</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/checkin')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Monthly Check-in</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/feedback')" style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Customer Feedback</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                            <div @click="$router.push('/inbox')" style="padding: 14px 16px; display: flex; justify-content: space-between; cursor: pointer;">
                                <span>Inbox</span>
                                <span style="color: var(--text-muted);">&gt;</span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                function contactUs() {
                    window.location.href = 'mailto:dvwegw.vbwre.fwew@gmail.com';
                }
                return { contactUs };
            }
        };

        // Sub-pages under Settings
        const VersionComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Version</div><div style="width:40px;"></div></div>
                    <div class="card" style="text-align: center; padding: 30px 16px;">
                        <h2 style="margin-bottom: 8px;">NJJIAMAX v2.4.0</h2>
                        <p style="color: var(--text-muted); font-size: 13px;">Stable production build for mobile webview.</p>
                    </div>
                </div>
            `
        };

        const PrivacyComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Privacy Policy</div><div style="width:40px;"></div></div>
                    <div class="card">
                        <h3 style="margin-bottom: 8px;">Data Protection</h3>
                        <p style="margin-bottom: 10px;">We respect your privacy. All financial calculations and local notes are stored securely on your device.</p>
                        <p>No unauthorized data collection is performed outside standard operational parameters.</p>
                    </div>
                </div>
            `
        };

        const TermsComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Terms of Service</div><div style="width:40px;"></div></div>
                    <div class="card">
                        <h3 style="margin-bottom: 8px;">Service Usage</h3>
                        <p style="margin-bottom: 10px;">By using NJJIAMAX, you agree to utilize the provided tools responsibly for personal financial analysis.</p>
                        <p>All market data is for reference purposes only.</p>
                    </div>
                </div>
            `
        };

        const TeamComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">About Team</div><div style="width:40px;"></div></div>
                    <div class="card">
                        <h3 style="margin-bottom: 8px;">NJJIAMAX Engineering</h3>
                        <p>We are a dedicated group of mobile frontend specialists building high-performance lightweight web solutions.</p>
                    </div>
                </div>
            `
        };

        const CheckinComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Monthly Check-in</div><div style="width:40px;"></div></div>
                    <div class="card" style="text-align: center;">
                        <h3 style="margin-bottom: 12px;">Daily Check-in</h3>
                        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">Check in daily to maintain your streak.</p>
                        <button class="btn" @click="checkIn" :disabled="checked">{{ checked ? 'Checked In Today' : 'Check In Now' }}</button>
                    </div>
                </div>
            `,
            setup() {
                const checked = ref(localStorage.getItem('nj_checked') === 'true');
                function checkIn() {
                    localStorage.setItem('nj_checked', 'true');
                    checked.value = true;
                    showToast('Check-in successful!');
                }
                return { checked, checkIn };
            }
        };

        const FeedbackComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Feedback</div><div style="width:40px;"></div></div>
                    <div class="card">
                        <div class="input-group">
                            <label>Title</label>
                            <input type="text" v-model="title" placeholder="Enter title..." />
                        </div>
                        <div class="input-group">
                            <label>Content</label>
                            <textarea rows="4" v-model="content" placeholder="Enter feedback..."></textarea>
                        </div>
                        <button class="btn" :style="{ opacity: isValid ? 1 : 0.5 }" :disabled="!isValid" @click="sendFeedback">Submit Feedback</button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');
                const isValid = computed(() => title.value.trim() && content.value.trim());

                function sendFeedback() {
                    if (!isValid.value) return;
                    showToast('Feedback sent successfully!');
                    title.value = '';
                    content.value = '';
                    setTimeout(() => router.back(), 500);
                }
                return { title, content, isValid, sendFeedback };
            }
        };

        const InboxComp = {
            template: `
                <div class="view-container no-tab">
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Inbox</div><div style="width:40px;"></div></div>
                    <div style="padding: 16px;">
                        <div class="card" @click="showAlert = true" style="cursor: pointer;">
                            <div style="font-weight: 600; margin-bottom: 4px;">Welcome</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Tap to read message content.</div>
                        </div>
                    </div>
                    <div v-if="showAlert" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:2000;">
                        <div class="card" style="width: 80%; background: var(--card-bg);">
                            <h3 style="margin-bottom: 8px;">Welcome to NJJIAMAX</h3>
                            <p style="font-size: 13px; margin-bottom: 16px; color: var(--text-muted);">Thank you for using our mobile webview app. Enjoy seamless local tools and real-time market overviews.</p>
                            <button class="btn" @click="showAlert = false">Close</button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const showAlert = ref(false);
                return { showAlert };
            }
        };

        // Router Setup
        const routes = [
            { path: '/', component: LoadingComp },
            { path: '/home', component: HomeComp },
            { path: '/toolbox', component: ToolboxComp },
            { path: '/settings', component: SettingsComp },
            { path: '/detail', component: StockDetailComp },
            { path: '/list/:type', component: StockSubListComp },
            { path: '/article', component: ArticleComp },
            { path: '/version', component: VersionComp },
            { path: '/privacy', component: PrivacyComp },
            { path: '/terms', component: TermsComp },
            { path: '/team', component: TeamComp },
            { path: '/checkin', component: CheckinComp },
            { path: '/feedback', component: FeedbackComp },
            { path: '/inbox', component: InboxComp }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // App Root Instance
        const app = createApp({
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    return ['/home', '/toolbox', '/settings'].includes(route.path);
                });
                return { showTabBar };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
